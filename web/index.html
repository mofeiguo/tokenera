<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>New API</title>
    <meta name="title" content="New API" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#f7fafc" />
    <script>
      ;(() => {
        const match = document.cookie.match(/(?:^|;\s*)vite-ui-theme=([^;]*)/)
        const saved = match ? decodeURIComponent(match[1]) : 'system'
        const dark =
          saved === 'dark' ||
          (saved !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        const resolved = dark ? 'dark' : 'light'
        document.documentElement.classList.add(resolved)
        document.documentElement.style.colorScheme = resolved
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', dark ? '#0b1020' : '#f7fafc')
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
